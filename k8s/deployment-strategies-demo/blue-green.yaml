apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bg-demo
      version: blue
  template:
    metadata:
      labels:
        app: bg-demo
        version: blue
    spec:
      containers:
        - name: app
          image: busybox
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "echo VERSION=blue; sleep 3600"]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bg-demo
      version: green
  template:
    metadata:
      labels:
        app: bg-demo
        version: green
    spec:
      containers:
        - name: app
          image: busybox
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "echo VERSION=green; sleep 3600"]

---
apiVersion: v1
kind: Service
metadata:
  name: bg-demo-service
spec:
  selector:
    app: bg-demo
    version: blue
  ports:
    - port: 80
      targetPort: 80
