apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: demo-db

spec:
  serviceName: demo-db
  replicas: 2

  selector:
    matchLabels:
      app: demo-db

  template:
    metadata:
      labels:
        app: demo-db

    spec:
      containers:
        - name: db
          image: redis:7.2
          ports:
            - containerPort: 6379

          volumeMounts:
            - name: data
              mountPath: /data

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 1Gi