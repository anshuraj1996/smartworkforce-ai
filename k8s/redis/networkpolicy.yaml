apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: redis-allow-backend-only

spec:
  podSelector:
    matchLabels:
      app: redis

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
        # The worker needs Redis too (birthday-job claims, notification badge counts)
        - podSelector:
            matchLabels:
              app: backend-worker
      ports:
        - protocol: TCP
          port: 6379
